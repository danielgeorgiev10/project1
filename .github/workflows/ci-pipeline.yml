name: Build and Push to Docker Hub
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install flake8
        run: pip install flake8

      - name: Run Linting
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Install dependencies
        run: |
          pip install flask pytest mysql-connector-python

      - name: Run Unit Tests
        run: pytest app/test_main.py

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/project-app:latest
            ${{ secrets.DOCKER_USERNAME }}/project-app:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/project-app:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'